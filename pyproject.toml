[project]
name = "music-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bubbletea14", email = "jonny.jin14@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "python-dateutil==2.9.0.post0",
    "requests>=2.34.2",
    "six==1.17.0",
    "tzdata==2026.3",
]

[project.scripts]
music-parser = "music_parser:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
